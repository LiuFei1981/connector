# Client Configuration Example with Redis Service Discovery

target:
  app_name: "connector.client"
  service_discovery_type: "srv"              # service discovery type: srv, a, direct
  direct_connect_ip_port: ""                 # used in direct mode
  service_name: "my-grpc-service"            # name of the service to connect to
  namespace_name: "default"
  region: "us-east-1"
  instance_version: ""
  instance_port: 0
  sd_timeout: 5
  sd_endpoint_cache_expires: 300
  sd_instance_max_result: 100
  trace_use_xray: false

grpc:
  dial_blocking_mode: true
  use_load_balancer: true
  use_health_check: true
  dial_min_connect_timeout: 5
  keepalive_inactive_ping_time_trigger: 120
  keepalive_inactive_ping_timeout: 20
  keepalive_permit_without_stream: true
  circuit_breaker_enabled: false

# Redis service discovery config (fallback)
redis:
  enabled: true                              # enable Redis service discovery
  endpoints:                                  # Redis endpoint list
    - "localhost:6379"
  password: ""                                # Redis password
  db: 0                                       # Redis database number
  instance_ttl: 45                            # instance TTL (seconds); should be greater than the server's heartbeat_interval

